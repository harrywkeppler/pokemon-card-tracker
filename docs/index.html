<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon card tracker</title>
<style>
:root{
  color-scheme:light;
  --page:#f4f3ef; --surface:#fcfcfb; --raise:#ffffff; --line:#e3e2dc; --line-soft:#eeede8;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#85847d;
  --up:#2a78d6; --down:#e34948; --series:#2a78d6;
  --crit:#d03b3b; --warn:#fab219; --chip:#eeede8; --focus:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#111110; --surface:#1a1a19; --raise:#222220; --line:#34342f; --line-soft:#2a2a27;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
    --up:#3987e5; --down:#e66767; --series:#3987e5;
    --crit:#e66767; --warn:#fab219; --chip:#2c2c29; --focus:#3987e5;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--text-2)}
.note{margin:14px 0 0;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--surface);border-radius:6px;color:var(--text-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{color:var(--text-2);font-size:12px}
.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--text-3);font-size:12px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input,.bar select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;min-height:34px}
.bar input[type=search]{flex:1 1 220px;min-width:160px}
.bar input[type=number]{width:96px}
.bar label{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);
  padding:9px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.tabs button .c{color:var(--text-3);font-weight:400;margin-left:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1040px}
th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--text)}
th .ar{color:var(--text-3);margin-left:3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font-weight:600}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.sub{color:var(--text-3);font-size:12px}
.d{white-space:nowrap}
.d i{font-style:normal;font-size:10px;margin-right:3px}
.d.up i{color:var(--up)} .d.down i{color:var(--down)}
.muted{color:var(--text-3)}
.sev{display:inline-flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.sev i{font-style:normal;font-size:11px}
.sev.high i{color:var(--crit)} .sev.medium i{color:var(--warn)} .sev.watch i{color:var(--text-3)}
.new{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:215px}
.chip{background:var(--chip);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--text-2);white-space:nowrap}
.chip.why{color:var(--text);font-weight:600}
.links{display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:12px;white-space:nowrap;justify-content:start}
.links a{color:var(--text-2)}
td.card{min-width:200px}
.spark{display:block;cursor:crosshair}
.empty{padding:36px 20px;text-align:center;color:var(--text-2)}
.more{display:block;width:100%;padding:11px;font:inherit;border:0;border-top:1px solid var(--line-soft);
  background:var(--surface);color:var(--text-2);cursor:pointer}
.more:hover{color:var(--text)}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);padding:5px 8px;border-radius:6px;
  font-size:12px;white-space:nowrap;display:none;z-index:10;font-variant-numeric:tabular-nums}
.how{padding:18px 22px;max-width:820px}
.how h3{margin:18px 0 6px;font-size:15px}
.how h3:first-child{margin-top:0}
.how p,.how li{color:var(--text-2)}
.how ul{margin:6px 0;padding-left:20px}
footer{margin-top:18px;color:var(--text-3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pokémon card tracker</h1>
    <p id="subtitle"></p>
    <div id="note"></div>
  </header>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <div class="bar" role="search">

    <select id="lang" aria-label="Language"><option value="">All languages</option></select>
    <label>$ <input type="number" id="pmin" min="0" step="50" placeholder="min" aria-label="Minimum price"></label>
    <label>to <input type="number" id="pmax" min="0" step="50" placeholder="max" aria-label="Maximum price"></label>
    <label><input type="checkbox" id="newonly"> New today</label>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <footer id="foot"></footer>
</div>

function delta(x){

function spark(sp){

  const Y = y => H - pad - (y1 === y0 ? .5 : (y - y0) / (y1 - y0)) * (H - 2 * pad);
  const path = sp.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const last = sp[sp.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Price over ${x1 - x0} days, ${money(sp[0][1])} to ${money(last[1])}" data-sp='${JSON.stringify(sp)}'>
    <path d="${path}" fill="none" stroke="var(--series)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>

function columns(tab){

  cols.push({h: "Card", k: "n", f: nameCell, cls: "card"});

  cols.push({h: "Rank", k: "pc", num: 1, f: pcCell, t: "Percentile of the 7-day move among all tracked cards today (100 = biggest gain, 0 = biggest drop)"});

const sevRank = {high: 3, medium: 2, watch: 1};
function val(c, k){
  if (k === "sevn") return sevRank[c.sev] || 0;
  if (k === "az") return c.z == null ? null : Math.abs(c.z);

function filtered(tab){
  const q = $("#q").value.trim().toLowerCase(), dir = $("#dir").value, sev = $("#sev").value, lang = $("#lang").value;
  const pmin = parseFloat($("#pmin").value), pmax = parseFloat($("#pmax").value), newonly = $("#newonly").checked;
  let rows = LISTS[tab].filter(c => {
    if (q && !(`${c.n} ${c.s} ${c.no}`.toLowerCase().includes(q))) return false;
    if (lang && c.lang !== lang) return false;
    if (!isNaN(pmin) && c.p < pmin) return false;
    if (!isNaN(pmax) && c.p > pmax) return false;
    if (dir){ const d = c.dir || (c.c7 == null ? "" : c.c7 >= 0 ? "up" : "down"); if (d !== dir) return false; }
    if (tab === "alerts"){ if (sev === "hm" ? c.sev === "watch" : sev && c.sev !== sev) return false; if (newonly && !c.new) return false; }
    return true;
  });
  const s = state.sort[tab];
  if (s) rows = rows.slice().sort((a, b) => {
    const x = val(a, s.k), y = val(b, s.k);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * s.dir;

function renderTable(tab){

      tab === "alerts" ? (M.days_of_history < 8 ? "No alerts yet. Seven-day signals begin once 8 days of prices are stored." : "No cards crossed an alert threshold today.") : "Nothing to show yet.";
    const watchHint = tab === "alerts" && $("#sev").value === "hm" && M.watch ? ` ${M.watch} card${M.watch === 1 ? " is" : "s are"} on the watch list.` : "";
    return `<div class="empty">${msg}${watchHint}</div>`;

function renderHistory(){

function renderHow(){
  const T = M.thresholds;
  return `<div class="how">
  <h3>What this tracks</h3>
  <p>Every Pokémon card printing whose TCGplayer market price is between $${M.band.min.toLocaleString()} and $${M.band.max.toLocaleString()}. TCGplayer's market price is built from recent completed sales, so it only changes when a card sells. For most cards in this range that is a few times a month, which makes the price a step line: flat, then a jump on the next sale.</p>
  <p>Because one sale can be an outlier (a graded copy sold as raw, a misprint, a typo), a price move only counts when something else backs it up: the lowest or median listing price moved the same way, or two or more separate sales moved the same way. A single sale that moves the price 3× or more while listings stay put is ignored.</p>
  <h3>When a card is flagged</h3>
  <ul>
    <li><b>7-day move:</b> price changed at least ${T.move_7d_pct}% and $${T.min_dollar_move} in a week, confirmed as above, and at least ${T.z_7d_min}× the card's normal weekly swing. Cards with too little history need ${T.move_7d_pct_no_history}%.</li>
    <li><b>1-day jump:</b> at least ${T.move_1d_pct}% and $${T.min_dollar_move} since the previous day, with listings moving the same way.</li>
    <li><b>30-day trend:</b> at least ${T.move_30d_pct}% over a month, built from two or more sales and matched by listings.</li>
    <li><b>Selling more often:</b> the price changed on at least ${T.activity_min_sale_days} of the last 7 days, and at a pace at least ${T.activity_spike_ratio}× faster than the three weeks before. This is a free, rough stand-in for a rise in sales volume.</li>
    <li><b>Volume spike:</b> units sold over the last 3 days at least ${T.volume_spike_ratio}× the card's usual pace (only for cards with sales-volume data).</li>
  </ul>
  <p><b>High:</b> a 7-day move of ${T.high_severity_7d_pct}%+ that is backed by both listings and repeat sales, or that comes with a jump in sales activity. <b>Medium:</b> any other 7-day move, a volume spike, or more frequent sales together with a price signal. <b>Watch list:</b> a 30-day trend, a 1-day jump, or more frequent sales on their own. The watch list is hidden by default; pick it in the severity filter.</p>
  <h3>Reading the columns</h3>
  <ul>
    <li><b>vs. normal:</b> the 7-day move divided by this card's usual 7-day swing, from the size of its typical price change per sale and how often it sells. 3× means the move is three times bigger than usual for that card.</li>
    <li><b>Rank:</b> percentile of the 7-day move across all tracked cards today. 99 is among the top 1% of gainers, 1 among the steepest drops.</li>
    <li><b>Sale days:</b> days in the last 30 on which the price changed. Cards with 2 or fewer are tagged "thinly traded": treat their moves with more caution.</li>
    <li><b>Check:</b> one-click searches for eBay sold listings, live eBay listings and Facebook Marketplace, to confirm a move and compare asking prices.</li>

  <h3>Limits</h3>

    <li>"Sale days" counts days with a price change, not units sold: two sales at the same price on one day count once.</li>
    <li>Facebook Marketplace publishes no sold prices and no data feed, so it is a search link, not a data source.</li>
  </ul></div>`;
}

  const sortBy = th => { const k = th.dataset.k, s = state.sort[state.tab];
    state.sort[state.tab] = {k, dir: s && s.k === k ? -s.dir : (k === "n" ? 1 : -1)}; render(); };
  $("#panel").addEventListener("click", e => {
    const th = e.target.closest("th[data-k]"); if (th) return sortBy(th);
    if (e.target.id === "more"){ state.shown += 200; render(); }
  });
  $("#panel").addEventListener("keydown", e => { const th = e.target.closest("th[data-k]"); if (th && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); sortBy(th); } });
  const tip = $("#tip");
  $("#panel").addEventListener("mousemove", e => {
    const svg = e.target.closest("svg.spark"); if (!svg){ tip.style.display = "none"; return; }
    const sp = JSON.parse(svg.dataset.sp), r = svg.getBoundingClientRect(), pad = 4, W = 132, H = 34;
    const xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const t = Math.min(1, Math.max(0, (e.clientX - r.left - pad) / (W - 2 * pad))), target = x0 + t * (x1 - x0);
    let best = sp[0]; for (const p of sp) if (Math.abs(p[0] - target) < Math.abs(best[0] - target)) best = p;
    const X = pad + (x1 === x0 ? 0 : (best[0] - x0) / (x1 - x0)) * (W - 2 * pad);
    const Y = H - pad - (y1 === y0 ? .5 : (best[1] - y0) / (y1 - y0)) * (H - 2 * pad);
    const cx = svg.querySelector(".cx"), cd = svg.querySelector(".cd");
    cx.setAttribute("x1", X); cx.setAttribute("x2", X); cx.setAttribute("visibility", "visible");
    cd.setAttribute("cx", X); cd.setAttribute("cy", Y);
    tip.textContent = `${dayLabel(best[0])} · ${money(best[1])}`;
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 150) + "px"; tip.style.top = (e.clientY - 34) + "px";
  });
  $("#panel").addEventListener("mouseleave", () => { tip.style.display = "none"; });
  render();
}
init();
</script>
</body>
