name: Daily card tracker

on:
  schedule:
    # 21:37 UTC every day (4:37 pm Eastern in winter). tcgcsv.com publishes
    # its once-a-day TCGplayer price build around 20:00 UTC.
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install archive and Excel libraries
        run: pip install py7zr openpyxl

      - name: Download prices, find movers, rebuild dashboard
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m tracker run

      - name: Show today's report on the run page
        if: always()
        run: |
          if [ -f REPORT.md ]; then head -c 900000 REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish the Excel workbook at its fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest data" \
              --notes "tracker.xlsx is replaced with fresh data every day. Download link: https://github.com/${{ github.repository }}/releases/download/latest/tracker.xlsx"
          gh release upload latest out/tracker.xlsx --clobber

      - name: Save data and dashboard to the repository
        run: |
          git config user.name "card-tracker"
          git config user.email "card-tracker@users.noreply.github.com"
          git add -A data docs REPORT.md
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Prices and alerts for $(date -u +%F)"
            git push
          fi
